{% extends "base.html" %}
{% block content %}
<section class="card center">
  <h2>Sign in to Gmail</h2>
  <p>Google needs you to sign in. The app only asks for permission to <strong>read</strong> your mail.</p>
  <p class="muted">While your Google project is in Testing mode, Google asks you to sign in again after 7 days.</p>
  <button class="primary" id="signin">Sign in with Google</button>
  <p class="muted" id="signin-status"></p>
</section>
{% endblock %}
